[project]
name = "decisions-reranker"
version = "0.2.0"
description = "A simple reranker for RAG systems, built on the OpenAI Decisions API. Requires an OpenAI API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Malte Weber", email = "dev-weber@posteo.de" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=3.28.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
